name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows installer
        run: make build-windows-installer
      - name: Upload Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/install-taxicheck-v*-windows.exe --clobber

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .
      - name: Upload snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.snapcraft.outputs.snap }}" --clobber

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: taxiprijs-flatpak.flatpak
          manifest-path: flatpak/dev.ramackers.TaxiCheck.yaml
      - name: Upload flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$PWD"
          gh release upload "${{ github.event.release.tag_name }}" taxiprijs-flatpak.flatpak --repo "${{ github.repository }}" --clobber